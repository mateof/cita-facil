###############################################################################
# Proxy inverso con TLS mutuo para DNI electrónico y certificados FNMT.
#
# Puntos importantes:
#
# - `ssl_verify_client optional` en lugar de `on`: si fuese obligatorio, el
#   navegador pediría certificado para *todas* las peticiones, incluida la
#   página de inicio, y quien entre con contraseña vería un diálogo de
#   certificado sin motivo. Con `optional`, el certificado solo se exige
#   realmente en la ruta de login por certificado.
# - `ssl_verify_depth 3`: la cadena del DNIe pasa por CA intermedia y raíz.
# - El certificado se reenvía codificado en URL (`$ssl_client_escaped_cert`),
#   que es la forma segura de meter un PEM multilínea en una cabecera HTTP.
###############################################################################

# Redirección de HTTP a HTTPS. El acceso con certificado no funciona sin TLS.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificado de servidor (Let's Encrypt u otro).
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Autoridades admitidas para el certificado de cliente: raíces e
    # intermedias del DNIe y de la FNMT, concatenadas en un único fichero.
    ssl_client_certificate /etc/nginx/trust/ca-bundle.pem;
    ssl_verify_client optional;
    ssl_verify_depth 3;

    # Lista de revocación. Descomentar cuando se tengan las CRL descargadas.
    # ssl_crl /etc/nginx/trust/crl-bundle.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        # Certificado de cliente y veredicto de la verificación.
        proxy_set_header X-Client-Cert   $ssl_client_escaped_cert;
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-DN     $ssl_client_s_dn;

        # Cabeceras que pudieran venir del exterior se descartan: si un
        # cliente pudiera inyectar X-Client-Cert entraría como quien quisiera.
        proxy_set_header X-Client-Cert-Original "";

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Los ficheros con hash en el nombre se cachean de forma agresiva.
    location ~* \.(js|css|woff2|png|svg|webp)$ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
